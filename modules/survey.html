<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Evening check-in</title>
<link rel="stylesheet" href="module.css" />
<style>
  main { max-width: 960px; margin: 0 auto; width: 100%; }
  .intro { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; color: var(--muted); margin-top: 0; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 20px; }
  th, td { padding: 10px 8px; border-bottom: 1px solid #ddd5c5; text-align: center; font-size: 14px; }
  th.q, td.q { text-align: left; width: 46%; font-size: 16px; }
  thead th { color: var(--muted); font-weight: 500; vertical-align: bottom; }
  td label { display: block; cursor: pointer; padding: 4px; }
  input[type=radio] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  fieldset { border: 0; padding: 0; margin: 0 0 22px; }
  legend { font-size: 17px; font-weight: 500; margin-bottom: 8px; }
  .opts label { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 16px; cursor: pointer; }
  textarea { width: 100%; min-height: 110px; font: 16px/1.5 'Source Serif 4', Georgia, serif; padding: 10px; border: 1.5px solid #cfc7b6; border-radius: 8px; }
  thead th { position: sticky; top: -24px; background: var(--panel); z-index: 1; box-shadow: 0 1px 0 #ddd5c5; }
  thead th:not(.q) { width: 10.8%; line-height: 1.25; }
  tbody tr:hover td { background: #efeadf; }
  tr.missing td { background: #f6e6df; }
  tr.missing td.q, fieldset.missing legend { color: #8a2a1f; }
  tr.missing td.q::before { content: 'Needs an answer: '; font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  /* scale items: a row of numbered radios with anchor words under their numbers */
  .scale { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); max-width: 680px; margin-top: 4px; }
  .scale label { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; cursor: pointer; border-radius: 6px; text-align: center; }
  .scale label:hover { background: #efeadf; }
  .scale .num { font-size: 15px; font-weight: 500; }
  .scale .anchor { font-size: 13px; line-height: 1.2; color: var(--muted); min-height: 2.4em; }
  .scale input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  fieldset.missing { background: #f6e6df; border-radius: 8px; padding: 6px 8px; }
  fieldset.missing legend::before { content: 'Needs an answer: '; font-weight: 600; }
  .progress { font-size: 14px; color: var(--muted); margin-right: auto; align-self: center; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">Evening check-in</h1><span class="meta" id="meta"></span></header>
  <main id="main"><p class="muted">Loading…</p></main>
  <footer>
    <span class="progress" id="progress"></span>
    <button class="btn ghost" id="later">Not yet</button>
    <button class="btn ghost" id="back">Back</button>
    <button class="btn" id="next">Next</button>
  </footer>
</div>
<script src="bridge.js"></script>
<script>
  let q = null, page = 0, filledRandomly = false;
  const answers = {};
  // Placeholder labels for {H} (heritage culture) and {M} (mainstream culture). Resolved on init.
  const HOME_LABELS = { cn: 'Chinese', mx: 'Mexican', in: 'Indian' };
  let labels = { H: 'heritage', M: 'American', homeCulture: null };
  const fill = (s) => String(s ?? '').replace(/\{(H|M)\}/g, (_, k) => labels[k]);

  function resolveLabels(p, content) {
    const ph = (content.instrument && content.instrument.placeholders) || {};
    const code = [p.homeCulture, p.player && p.player.homeCulture, p.culture, content.homeCulture]
      .find((c) => typeof c === 'string' && c) || null;
    const byCode = Object.assign({}, HOME_LABELS, ph.H && ph.H.byHomeCulture);
    const H = (code && byCode[code]) || (ph.H && ph.H.fallback) || 'heritage';
    const M = (ph.M && ph.M.value) || 'American';
    return { H, M, homeCulture: code && byCode[code] ? code : null };
  }

  /** BIIS-2 scoring from item metadata: subscale means after reversing (6 - x on a 1..5 scale), plus unflipped raw halves by facet. */
  const FACET_KEYS = { harmony: 'harmonyRaw', conflict: 'conflictRaw', blend: 'blendRaw', comp: 'compRaw' };
  function scoreInstrument() {
    const inst = q.instrument;
    if (!inst || !inst.id) return null;
    const items = q.pages.flatMap((pg) => pg.items || []).filter((it) => it.type === 'likert' && it.subscale);
    if (!items.length) return null;
    const mean = (xs) => xs.length ? Math.round((xs.reduce((a, b) => a + b, 0) / xs.length) * 1000) / 1000 : null;
    const sub = {}, facet = {};
    for (const it of items) {
      const x = Number(answers[it.id]);
      if (!Number.isFinite(x)) continue;
      const sc = it.scale || { min: 1, max: 5 };
      (sub[it.subscale] = sub[it.subscale] || []).push(it.reverse ? sc.min + sc.max - x : x);
      if (it.facet) (facet[it.facet] = facet[it.facet] || []).push(x);
    }
    const scores = { harmony: mean(sub.harmony || []), blendedness: mean(sub.blendedness || []) };
    for (const [f, key] of Object.entries(FACET_KEYS)) scores[key] = mean(facet[f] || []);
    return { instrument: inst.id, scores };
  }
  const main = document.getElementById('main'), nextB = document.getElementById('next'), backB = document.getElementById('back');
  const err = document.createElement('p'); err.className = 'err'; err.setAttribute('role', 'alert');
  const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, attrs); kids.forEach((k) => e.append(k)); return e; };
  document.getElementById('later').onclick = () => GV.send({ type: 'close' });
  backB.onclick = () => { if (page > 0) { page--; render(); } };
  nextB.onclick = () => {
    const missing = q.pages[page].items.filter((it) => it.type !== 'text' && (answers[it.id] === undefined || answers[it.id] === ''));
    main.querySelectorAll('.missing').forEach((n) => n.classList.remove('missing'));
    if (missing.length) {
      missing.forEach((it) => main.querySelector(`[data-item="${CSS.escape(it.id)}"]`)?.classList.add('missing'));
      err.textContent = `Please answer ${missing.length === 1 ? 'the highlighted question' : `the ${missing.length} highlighted questions`}.`;
      main.querySelector('.missing input')?.focus();
      document.getElementById('progress').textContent = err.textContent;
      return;
    }
    if (page < q.pages.length - 1) { page++; render(); return; }
    nextB.disabled = true;
    // Scores are computed here and logged with the answers; they are never shown to the participant.
    const scored = scoreInstrument();
    const out = { ...answers };
    if (filledRandomly) out.filledRandomly = true; // testing shortcut was used: researchers can drop these rows
    if (scored) Object.assign(out, { instrument: scored.instrument, labels: { ...labels }, scores: scored.scores });
    GV.send({ type: 'submit', answers: out });
  };

  function likertMatrix(items) {
    const sc = items[0].scale || { min: 1, max: 5 };
    const vals = []; for (let v = sc.min; v <= sc.max; v++) vals.push(v);
    const head = el('tr', {}, el('th', { className: 'q', textContent: '' }));
    const named = Array.isArray(sc.labels) && sc.labels.length === vals.length;
    vals.forEach((v, i) => head.append(el('th', { scope: 'col', textContent: named ? sc.labels[i] : i === 0 ? `${v} ${sc.minLabel || ''}` : i === vals.length - 1 ? `${v} ${sc.maxLabel || ''}` : String(v) })));
    const body = el('tbody');
    items.forEach((it) => {
      const s = it.scale || sc;
      const tr = el('tr', { role: 'radiogroup' }); tr.dataset.item = it.id;
      const text = fill(it.text);
      tr.setAttribute('aria-label', text);
      tr.append(el('td', { className: 'q', textContent: text }));
      for (let v = s.min; v <= s.max; v++) {
        const inp = el('input', { type: 'radio', name: it.id, value: String(v), checked: answers[it.id] === v });
        const lab = Array.isArray(s.labels) && s.labels[v - s.min] ? s.labels[v - s.min] : v === s.min ? s.minLabel : v === s.max ? s.maxLabel : '';
        inp.setAttribute('aria-label', `${v}${lab ? ` (${lab})` : ''}`);
        inp.onchange = () => { answers[it.id] = v; tr.classList.remove('missing'); };
        tr.append(el('td', {}, el('label', {}, inp)));
      }
      body.append(tr);
    });
    return el('table', {}, el('thead', {}, head), body);
  }

  /** `scale` item: integers min..max as one radio group (shared name, so arrow keys move within it); `anchors` maps a value to the word shown under it. */
  function scaleRow(it) {
    const min = Number(it.min ?? 1), max = Number(it.max ?? 5), anchors = it.anchors || {};
    const fs = el('fieldset', {}, el('legend', { textContent: fill(it.text) })); fs.dataset.item = it.id;
    const row = el('div', { className: 'scale' }); row.style.setProperty('--n', String(max - min + 1));
    for (let v = min; v <= max; v++) {
      const word = anchors[String(v)] ? fill(anchors[String(v)]) : '';
      const inp = el('input', { type: 'radio', name: it.id, value: String(v), checked: answers[it.id] === v });
      inp.setAttribute('aria-label', `${v}${word ? ` (${word})` : ''}`);
      inp.onchange = () => { answers[it.id] = v; fs.classList.remove('missing'); };
      row.append(el('label', {}, inp, el('span', { className: 'num', textContent: String(v) }), el('span', { className: 'anchor', textContent: word })));
    }
    fs.append(row);
    return fs;
  }

  function render() {
    err.textContent = '';
    const items = q.pages[page].items || [];
    const nodes = [];
    if (page === 0 && q.intro) nodes.push(el('p', { className: 'intro', textContent: fill(q.intro) }));
    let run = [];
    const flush = () => { if (run.length) { nodes.push(likertMatrix(run)); run = []; } };
    for (const it of items) {
      if (it.type === 'likert') { if (run.length && JSON.stringify(run[0].scale) !== JSON.stringify(it.scale)) flush(); run.push(it); continue; }
      flush();
      if (it.type === 'choice') {
        const fs = el('fieldset', {}, el('legend', { textContent: fill(it.text) })); fs.dataset.item = it.id;
        const opts = el('div', { className: 'opts' });
        (it.options || []).forEach((o) => {
          const inp = el('input', { type: 'radio', name: it.id, value: o, checked: answers[it.id] === o });
          inp.onchange = () => { answers[it.id] = o; fs.classList.remove('missing'); };
          opts.append(el('label', {}, inp, fill(o)));
        });
        fs.append(opts); nodes.push(fs);
      } else if (it.type === 'scale') {
        nodes.push(scaleRow(it));
      } else if (it.type === 'text') {
        const id = `t_${it.id}`;
        const ta = el('textarea', { id, value: answers[it.id] || '' });
        ta.oninput = () => { answers[it.id] = ta.value; };
        const wrap = el('div', {}, el('label', { htmlFor: id, textContent: fill(it.text), style: 'display:block;font-size:17px;font-weight:500;margin-bottom:8px' }), ta);
        wrap.dataset.item = it.id; nodes.push(wrap);
      }
    }
    flush();
    nodes.push(err);
    main.replaceChildren(...nodes);
    backB.hidden = page === 0;
    nextB.textContent = page === q.pages.length - 1 ? 'Submit' : 'Next';
    document.getElementById('progress').textContent = `Page ${page + 1} of ${q.pages.length}`;
    main.scrollTop = 0;
    (main.querySelector('input, textarea') || nextB).focus();
  }

  GV.on('init', (p) => {
    q = p.content && Array.isArray(p.content.pages) ? p.content : { title: 'Evening check-in', pages: [{ items: [] }] };
    labels = resolveLabels(p, q);
    for (const k of Object.keys(answers)) delete answers[k];
    filledRandomly = false;
    document.getElementById('title').textContent = fill(q.title) || 'Evening check-in';
    document.getElementById('meta').textContent = `Day ${p.day}`;
    page = 0; render();
  });
  // Testing shortcut: typing r-a-n-d-o-m anywhere in the survey (outside the text box) fills every unanswered
  // likert/scale/choice item on every page with a random valid answer. Text items stay empty; Submit is left to the person.
  const MAGIC = 'random';
  let typed = '';
  document.addEventListener('keydown', (e) => {
    if (!q || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
    const t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type === 'text'))) return;
    typed = (typed + e.key.toLowerCase()).slice(-MAGIC.length);
    if (typed !== MAGIC) return;
    typed = '';
    const pick = (n) => Math.floor(Math.random() * n);
    for (const it of q.pages.flatMap((pg) => pg.items || [])) {
      if (answers[it.id] !== undefined && answers[it.id] !== '') continue;
      if (it.type === 'likert') { const sc = it.scale || { min: 1, max: 5 }; answers[it.id] = sc.min + pick(sc.max - sc.min + 1); }
      else if (it.type === 'scale') { const lo = Number(it.min ?? 1), hi = Number(it.max ?? 5); answers[it.id] = lo + pick(hi - lo + 1); }
      else if (it.type === 'choice' && (it.options || []).length) answers[it.id] = it.options[pick(it.options.length)];
    }
    filledRandomly = true;
    render();
  });

  // Standalone preview: load the live questionnaire (?culture=cn|mx|in picks the heritage label); inline placeholder if that fails.
  if (!GV.inFrame) {
    const culture = new URLSearchParams(location.search).get('culture');
    fetch('../content/questionnaire/eod.json').then((r) => r.ok ? r.json() : Promise.reject(r.status))
      .then((content) => GV.fallback({ day: 1, homeCulture: culture, content }))
      .catch(() => fallbackInline());
  }
  function fallbackInline() { GV.fallback({ day: 1, content: { id: 'preview', title: 'Evening check-in (preview)', intro: 'Opened outside the game.', pages: [
    { items: [ { id: 'a', type: 'likert', text: 'Placeholder A', scale: { min: 1, max: 5, minLabel: 'Strongly disagree', maxLabel: 'Strongly agree' } },
               { id: 'b', type: 'likert', text: 'Placeholder B', scale: { min: 1, max: 5, minLabel: 'Strongly disagree', maxLabel: 'Strongly agree' } } ] },
    { items: [ { id: 'mood', type: 'choice', text: 'Mood?', options: ['Good', 'Okay', 'Hard'] }, { id: 'note', type: 'text', text: 'Anything else?' } ] } ] } }); }
</script>
</body>
</html>
