# Fixture for SPEC "Presence, place and conversation limits": the dialogue scene column, seated slots, screens, prop quads.
scenes:
  - id: home
    name: Home
    community: neutral
    background: bg_home_day
    description: "Test home."
    exits: [{ to: park, label: "Out" }, { to: work, label: "Work" }]
    hotspots:
      - { id: bed, label: "Bed", zone: { x: 0.8, y: 0.4, w: 0.15, h: 0.3 }, action: { type: end_day } }
    screens:
      - { id: tv, quad: [[0.10, 0.10], [0.30, 0.12], [0.30, 0.28], [0.10, 0.30]] }
    slots:
      - { id: left, x: 0.25, y: 0.90, scale: 0.5 }
  - id: park
    name: Park
    community: us
    background: bg_park_day
    description: "Test park."
    exits: [{ to: home, label: "Home" }]
    props:   # a prop projected onto a table top (Prop quad), with a quad for the evening render
      - asset: prop_chessboard
        x: 0.2
        y: 0.5
        w: 0.2
        quad: [[0.20, 0.536], [0.41, 0.537], [0.40, 0.578], [0.21, 0.578]]
        byBackground: { bg_park_eve: [[0.20, 0.53], [0.41, 0.53], [0.40, 0.57], [0.21, 0.57]] }
    slots:
      - { id: stand, x: 0.40, y: 0.90, scale: 0.5 }          # open path
      - { id: bench, x: 0.70, y: 0.90, scale: 0.4, seated: true }  # on the bench
  - id: work
    name: Work
    community: neutral
    background: bg_work_day
    description: "Test office."
    exits: [{ to: home, label: "Home" }]
    slots:
      - { id: desk, x: 0.5, y: 0.9, scale: 0.5 }
