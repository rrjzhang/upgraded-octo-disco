# Great Vote demo scenes. Zones, props and slots are fractions of the 1536 x 1024 background, origin top-left.
# Slot x,y = feet anchor (for seated figures: bottom of the stool); scale = figure height / image height.
# Every scene has a `near` slot (scale ~0.9, feet at the bottom edge) for the person the player is clearly there to talk to;
# overheard or incidental people use the smaller slots further back, or are painted into the background (`painted`).
# Prop x,y = top-left of the prop image; w = fraction of image width; height follows the prop's aspect
# unless an optional h is given (used only for the chessboard, which must be foreshortened onto the table top).
scenes:
  - id: home
    name: Home
    community: neutral
    background: bg_home_day
    lighting: warm_indoor
    description: "Your living room. The radiator ticks. The TV on the far wall is still on from last night."
    exits:
      - { to: street, label: "Front door" }
    hotspots:
      - id: tv
        label: "TV"
        zone: { x: 0.04, y: 0.09, w: 0.19, h: 0.29 }   # the wall-mounted TV generated into bg_home_tv_day/eve (Round 2, files 46/47)
        action: { type: window, module: tv, cost: 1 }
      - id: newspaper
        label: "Newspaper"
        zone: { x: 0.46, y: 0.62, w: 0.10, h: 0.07 }
        action: { type: news, cost: 1 }
      - id: bookshelf
        label: "Bookshelf"
        zone: { x: 0.28, y: 0.10, w: 0.10, h: 0.48 }
        action: { type: look, text: "Paperbacks, a rice cooker manual you keep meaning to throw out, and a photo of your parents at someone's wedding." }
      - id: window
        label: "Window"
        zone: { x: 0.63, y: 0.00, w: 0.17, h: 0.35 }
        action: { type: look, text: "Brick buildings across the street. Someone on the second floor is drying laundry on a rack by the window." }
      - id: bed
        label: "Bedroom (go to bed)"
        zone: { x: 0.89, y: 0.12, w: 0.08, h: 0.46 }
        action: { type: end_day }
    slots:
      - { id: near, x: 0.66, y: 1.0, scale: 0.92 }      # a visitor standing in the room, conversational distance (clear of the bedroom door zone)
      - { id: by_hall, x: 0.84, y: 0.80, scale: 0.62 }
      - { id: by_sofa, x: 0.30, y: 0.86, scale: 0.64 }

  - id: work
    name: Work
    community: neutral
    background: bg_work_day
    lighting: cool_indoor
    description: "The logistics office on the fourth floor. Someone has written 'Q3!!' on the whiteboard and nothing else."
    exits:
      - { to: street, label: "Elevator down" }
    hotspots:
      - id: computer
        label: "Your computer (start a shift)"
        zone: { x: 0.485, y: 0.30, w: 0.15, h: 0.14 }
        action: { type: window, module: work, cost: 2 }
      - id: whiteboard
        label: "Whiteboard"
        zone: { x: 0.38, y: 0.10, w: 0.26, h: 0.24 }
        action: { type: look, text: "'Q3!!' in green marker. Under it, smaller, in someone else's handwriting: 'who took my stapler'." }
      - id: window
        label: "Window"
        zone: { x: 0.87, y: 0.00, w: 0.13, h: 0.38 }
        action: { type: look, text: "The back of the clinic on Fifth, and past it the roof of the community center on Grand." }
    slots:
      - { id: near, x: 0.24, y: 1.0, scale: 0.92 }
      - { id: desk_left, x: 0.30, y: 0.80, scale: 0.60 }
      - { id: by_cabinet, x: 0.78, y: 0.74, scale: 0.56 }

  - id: clinic
    name: Fifth Street Clinic
    community: us
    background: bg_clinic_day
    lighting: warm_indoor
    description: "The waiting room smells of hand sanitizer. A TV in the corner plays the news with captions on."
    exits:
      - { to: street, label: "Back to the street" }
    hotspots:
      - id: tv
        label: "TV"
        zone: { x: 0.03, y: 0.02, w: 0.14, h: 0.17 }   # the corner TV generated into bg_clinic_tv_day (Round 2, file 48)
        action: { type: window, module: tv, cost: 1 }
      - id: magazines
        label: "Magazines and local paper"
        zone: { x: 0.36, y: 0.51, w: 0.28, h: 0.06 }
        action: { type: news, cost: 1 }
      - id: reception
        label: "Reception desk"
        zone: { x: 0.84, y: 0.30, w: 0.16, h: 0.38 }
        action: { type: look, text: "A clipboard with the intake form. The language line card is taped to the counter, a little curled at the corners." }
      - id: water
        label: "Water cooler"
        zone: { x: 0.01, y: 0.23, w: 0.08, h: 0.40 }
        action: { type: look, text: "Paper cones, the kind that go soft if you hold them too long." }
    slots:
      - { id: near, x: 0.30, y: 1.0, scale: 0.92 }
      - { id: front_desk, x: 0.78, y: 0.80, scale: 0.60 }
      - { id: by_cooler, x: 0.17, y: 0.80, scale: 0.60 }
      - { id: by_chairs, x: 0.62, y: 0.70, scale: 0.50 }
      - { id: by_table, x: 0.46, y: 0.90, scale: 0.66 }
      - { id: waiting_seat, x: 0.36, y: 0.56, scale: 0.34 }   # seated, on the row of waiting chairs

  - id: library
    name: Elm Street Library
    community: us
    background: bg_library_day
    lighting: warm_indoor
    description: "The main reading room. Green lamps on the long tables, a sign-up sheet for the Thursday potluck by the desk."
    exits:
      - { to: street, label: "Back to the street" }
    hotspots:
      - id: newspaper
        label: "Newspapers on the table"
        zone: { x: 0.56, y: 0.46, w: 0.07, h: 0.05 }
        action: { type: news, cost: 1 }
      - id: board
        label: "Bulletin board"
        zone: { x: 0.00, y: 0.03, w: 0.07, h: 0.46 }
        action: { type: look, text: "ESL Tuesdays 6pm. Citizenship class, Room 3. A lost cat named Biscuit. A flyer for the Thursday potluck in English, Spanish and Chinese." }
      - id: desk
        label: "Circulation desk"
        zone: { x: 0.75, y: 0.48, w: 0.25, h: 0.12 }
        action: { type: look, text: "A bell nobody rings and a jar of pencils. The holds shelf has a book with your name on it." }
      - id: window
        label: "Windows"
        zone: { x: 0.32, y: 0.12, w: 0.39, h: 0.30 }
        action: { type: look, text: "Bare trees and the church steeple on Grand. It looks colder out there than it is." }
    slots:
      - { id: near, x: 0.30, y: 1.0, scale: 0.92 }      # on the open floor in front of the left shelves, facing the player
      - { id: desk, x: 0.66, y: 0.88, scale: 0.62 }
      - { id: reading_table, x: 0.53, y: 0.67, scale: 0.40 }
      - { id: by_shelves, x: 0.12, y: 0.76, scale: 0.50 }
      - { id: armchair, x: 0.28, y: 0.56, scale: 0.30 }
      - { id: reading_seat, x: 0.45, y: 0.68, scale: 0.30 }   # seated, at the near end of the long table

  - id: park
    name: Riverside Park
    community: neutral
    background: bg_park_day
    # Round 2 variant with the two chess players painted into the image. Used automatically once the asset exists
    # (and both players are in the roster); the two `talk` zones below then stand for them. Otherwise the plain
    # park is shown and the cut-out figures sit in chess_left / chess_right as before.
    painted:
      background: bg_park_chess_day
      npcs: [cn_stranger_a, us_stranger_a]
    lighting: outdoor
    description: "The chess tables by the path. Leaves on the paving, a lamppost, regulars who nod but don't say much."
    exits:
      - { to: street, label: "Back to the street" }
    props:
      - { asset: prop_chessboard, x: 0.235, y: 0.515, w: 0.165, h: 0.065 }
    hotspots:
      - id: chess_left_player
        label: "Mr. Lin"
        zone: { x: 0.12, y: 0.41, w: 0.16, h: 0.45 }   # measured on bg_park_chess_day (Round 2, file 49)
        action: { type: talk, npc: cn_stranger_a }
      - id: chess_right_player
        label: "Walt"
        zone: { x: 0.37, y: 0.42, w: 0.17, h: 0.45 }
        action: { type: talk, npc: us_stranger_a }
      - id: chess_table
        label: "Chess table"
        zone: { x: 0.17, y: 0.53, w: 0.29, h: 0.30 }
        action: { type: look, text: "A game left mid-way. Someone has scratched a xiangqi river into the stone across the middle of the board, faint enough to miss." }
      - id: lamppost
        label: "Lamppost"
        zone: { x: 0.74, y: 0.16, w: 0.03, h: 0.27 }
        action: { type: look, text: "A flyer taped to it: 'Neighborhood Association meeting, 2nd Tuesday. Keep the Fifth Street lot as parking.'" }
      - id: path
        label: "Path"
        zone: { x: 0.80, y: 0.42, w: 0.18, h: 0.50 }
        action: { type: look, text: "Joggers, a woman pushing a stroller with a dog in it, a man practising tai chi under the far trees." }
    slots:
      - { id: chess_left, x: 0.13, y: 0.92, scale: 0.50 }    # seated, bench on the near-left of the nearest table
      - { id: chess_right, x: 0.53, y: 0.90, scale: 0.50 }   # seated, bench on the near-right of the nearest table
      - { id: path, x: 0.80, y: 0.80, scale: 0.52 }
      - { id: by_tables, x: 0.66, y: 0.66, scale: 0.38 }
      - { id: by_lamp, x: 0.74, y: 0.58, scale: 0.34 }
      - { id: by_fence, x: 0.60, y: 0.60, scale: 0.34 }
      - { id: path_far, x: 0.88, y: 0.62, scale: 0.36 }

  - id: center_cn
    name: Grand Avenue Community Center
    community: home
    background: bg_center_cn_day
    lighting: warm_indoor
    description: "The main hall. Folding chairs stacked by the windows, lanterns left up from spring, something with ginger cooking in the kitchen."
    exits:
      - { to: street, label: "Back to the street" }
    hotspots:
      - id: board
        label: "Notice board"
        zone: { x: 0.675, y: 0.22, w: 0.135, h: 0.14 }
        action: { type: look, text: "Seniors' tablet class moved to Wednesdays. Mid-Autumn committee: volunteers needed. Free blood pressure checks Saturday with Dr. Zhou. Saturday school fees due." }
      - id: scroll
        label: "Scroll painting"
        zone: { x: 0.35, y: 0.13, w: 0.31, h: 0.17 }
        action: { type: look, text: "Mountains and a lake in ink. A small card underneath says it was donated by the Wu family in 1997." }
      - id: table
        label: "Long table"
        zone: { x: 0.36, y: 0.39, w: 0.27, h: 0.11 }
        action: { type: look, text: "A sign-in sheet for the seniors' lunch, a box of red envelopes left over from New Year, and somebody's reading glasses." }
      - id: kitchen
        label: "Kitchen"
        zone: { x: 0.85, y: 0.21, w: 0.14, h: 0.28 }
        action: { type: look, text: "Two big pots on the stove. A handwritten sign: 'Wash your own bowl. This means you.'" }
    slots:
      - { id: near, x: 0.24, y: 1.0, scale: 0.92 }      # in front of the stacked chairs, conversational distance
      - { id: by_table, x: 0.50, y: 0.74, scale: 0.56 }
      - { id: by_board, x: 0.74, y: 0.64, scale: 0.46 }
      - { id: by_kitchen, x: 0.88, y: 0.60, scale: 0.42 }
      - { id: mid_right, x: 0.60, y: 0.90, scale: 0.62 }
      - { id: seated_hall, x: 0.44, y: 0.72, scale: 0.42 }   # seated, on the open floor left of the long table

  - id: street
    name: Street
    community: neutral
    background: none
    lighting: outdoor
    description: "Fifth Street and Grand Avenue. Everything you need is a short walk away."
    exits:
      - { to: home, label: "Home" }
      - { to: work, label: "Work" }
      - { to: clinic, label: "Fifth Street Clinic" }
      - { to: library, label: "Elm Street Library" }
      - { to: park, label: "Riverside Park" }
      - { to: center_cn, label: "Grand Avenue Community Center" }
    hotspots: []
    slots: []
