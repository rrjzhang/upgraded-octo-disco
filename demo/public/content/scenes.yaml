  - id: park
    name: Riverside Park
    community: neutral
    background: bg_park_day
    # Round 2 variant with the two chess players painted into the image. Used automatically once the asset exists
    # (and both players are in the roster); the two `talk` zones below then stand for them. Otherwise the plain
    # park is shown and the cut-out figures sit in chess_left / chess_right as before.
    painted:
      background: bg_park_chess_day
      npcs: [cn_stranger_a, us_stranger_a]
    # The chess game in progress (bg_park_board_day_A, request 193) is drawn only while someone present sits at the board;
    # otherwise the plain park with its empty inlaid board (bg_park_empty_day_A, request 240; until then bg_park_day_A).
    occupied:
      background: bg_park_game_day
      slots: [chess_left, chess_right]
    lighting: outdoor
    horizon: 0.31        # the three stone tables (0.75 m) at three depths give 0.30, 0.30, 0.32
    description: "The chess tables by the path. Leaves on the paving, a lamppost, regulars who nod but don't say much."
    exits:
      - { to: street, label: "Back to the street" }
    # No props: the chess game is baked into the park photo (bg_park_board_day_A, image request 193) and shown through
    # `occupied` above; the empty board is part of the plain photo.
    hotspots:
      - id: chess_left_player
        label: "Mr. Lin"
        zone: { x: 0.12, y: 0.41, w: 0.16, h: 0.45 }   # measured on bg_park_chess_day (Round 2, file 49)
        action: { type: talk, npc: cn_stranger_a }
      - id: chess_right_player
        label: "Walt"
        zone: { x: 0.37, y: 0.42, w: 0.17, h: 0.45 }
        action: { type: talk, npc: us_stranger_a }
      - id: chess_table
        label: "Chess table"
        zone: { x: 0.17, y: 0.53, w: 0.29, h: 0.30 }
        action: { type: look, text: "A chessboard inlaid in the stone top. The squares in the middle are worn pale where everyone's hands go." }
      - id: lamppost
        label: "Lamppost"
        zone: { x: 0.74, y: 0.16, w: 0.03, h: 0.27 }
        action: { type: look, text: "A flyer taped to it: 'Neighborhood Association meeting, 2nd Tuesday. Keep the Fifth Street lot as parking.'" }
      - id: path
        label: "Path"
        zone: { x: 0.80, y: 0.42, w: 0.18, h: 0.50 }
        action: { type: look, text: "Joggers, a woman pushing a stroller with a dog in it, a man practising tai chi under the far trees." }
    slots:
      # Open ground: the hexagonal paving around the tables and the asphalt path on the right. The fence line behind the
      # tables is planted or hidden behind benches, so nobody stands right at it.
      - { id: chess_left, x: 0.19, y: 0.86, seated: true }    # on the near-left bench of the nearest table (where Mr. Lin sits in bg_park_chess_day)
      - { id: chess_right, x: 0.47, y: 0.86, seated: true }   # on the near-right bench of the nearest table (where Walt sits in bg_park_chess_day)
      - { id: path, x: 0.89, y: 0.82 }      # on the asphalt path, right of the cobble edge
      - { id: by_tables, x: 0.725, y: 0.67 } # on the paving right of the middle table's near bench, before the cobbles
      - { id: by_lamp, x: 0.795, y: 0.555 }  # on the paving right of the lamppost, behind the far table's right bench
      - { id: by_fence, x: 0.62, y: 0.74 }  # on the paving in front of the middle table's near bench (table and fence behind)
      - { id: path_far, x: 0.95, y: 0.60 }  # on the asphalt path where it bends away

