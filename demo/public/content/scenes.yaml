# Great Vote demo scenes. Zones, props and slots are fractions of the 1536 x 1024 background, origin top-left.
# Slot x,y = feet anchor (for seated figures: bottom of the stool or bench). y may run past 1.0 (up to 1.25): the feet are
# below the frame and the legs are cropped, as in a photo taken closer. Figure height comes from the scene's perspective:
#   height / image height = (y - horizon) * personHeight / cameraHeight     (person 1.70 m standing, 1.30 m seated)
# so a standing adult's head lands just above the horizon at any depth. `horizon` is the eye-level line, read off each
# background from vanishing lines and from objects of known height (doors 2.1 m, tables 0.75 m, chair backs 0.9 m):
#   horizon = floor_y - (cameraHeight / objectHeight) * (floor_y - top_y)  for an object standing on the floor at floor_y.
# `cameraHeight` defaults to 1.6 m. An explicit slot `scale` (figure height / image height) still overrides the formula.
# Every scene has a `near` slot (feet at or just below the bottom edge) for the person the player is clearly there to talk to;
# overheard or incidental people use the smaller slots further back, or are painted into the background (`painted`).
# Prop x,y = top-left of the prop image; w = fraction of image width; height follows the prop's aspect
# unless an optional h is given (used only for the chessboard, which must be foreshortened onto the table top).
scenes:
  - id: home
    name: Home
    community: neutral
    background: bg_home_day
    lighting: warm_indoor
    horizon: 0.29        # rug edges meet at y 0.29; sofa back, coffee table and the hall doorway all put the camera near 1.0 m
    cameraHeight: 1.0    # a low, seated-eye-level shot: standing people in this room are tall in frame and the head leaves the top quickly
    # SPEC "Content schemas" byPack: gentle per-pack edits of the culture-neutral room (image_generation 194-199: three
    # small objects each, TV untouched). Used once the asset exists; the TV quads below apply through the base replaced.
    byPack:
      cn: { background: bg_home_cn_day, evening: bg_home_cn_eve }   # blue-and-white bowl of mandarins, lidded tea cup, red knot
      mx: { background: bg_home_mx_day, evening: bg_home_mx_eve }   # Talavera-style bowl, striped woven blanket, barro negro vase
      in: { background: bg_home_in_day, evening: bg_home_in_eve }   # unlit brass diya, block-print cushion, tulsi plant
    description: "Your living room. The radiator ticks. The TV on the far wall is still on from last night."
    exits:
      - { to: street, label: "Front door" }
    hotspots:
      - id: tv
        label: "TV"
        zone: { x: 0.04, y: 0.09, w: 0.19, h: 0.29 }   # the wall-mounted TV generated into bg_home_tv_day/eve (Round 2, files 46/47)
        action: { type: window, module: tv, cost: 1 }
      - id: newspaper
        label: "Newspaper"
        zone: { x: 0.46, y: 0.62, w: 0.10, h: 0.07 }
        action: { type: news, cost: 1 }
      - id: bookshelf
        label: "Bookshelf"
        zone: { x: 0.28, y: 0.10, w: 0.10, h: 0.48 }
        action:
          type: look
          text: "Paperbacks, a rice cooker manual you keep meaning to throw out, and a photo of your parents at someone's wedding."
          textByPack:   # SPEC "Content schemas": names the objects the pack's living room adds (requests 194-199)
            cn: "Paperbacks, a rice cooker manual you keep meaning to throw out, the little red knot your mother tied hanging off the middle shelf, and a photo of your parents at someone's wedding."
            mx: "Paperbacks, a small black clay vase your aunt carried up from Oaxaca wrapped in three sweaters, and a photo of your parents at someone's wedding."
            in: "Paperbacks, a small brass oil lamp your mother packed for you, still unlit, and a photo of your parents at someone's wedding."
      - id: window
        label: "Window"
        zone: { x: 0.63, y: 0.00, w: 0.17, h: 0.35 }
        action: { type: look, text: "Brick buildings across the street. Someone on the second floor is drying laundry on a rack by the window." }
      - id: bed
        label: "Bedroom (go to bed)"
        zone: { x: 0.89, y: 0.12, w: 0.08, h: 0.46 }
        action: { type: end_day }
    screens:
      # TV glass corners (TL, TR, BR, BL) measured on bg_home_day. bg_home_eve was generated separately and its TV sits a
      # little higher on the left: [[0.049, 0.085], [0.233, 0.137], [0.233, 0.350], [0.049, 0.371]] (`byBackground`, for
      # the engine to pick up; the engine currently reads only `quad`).
      - id: tv
        quad: [[0.050, 0.100], [0.232, 0.138], [0.232, 0.352], [0.050, 0.377]]
        byBackground:
          bg_home_eve: [[0.049, 0.085], [0.233, 0.137], [0.233, 0.350], [0.049, 0.371]]
    # SPEC 2026-10-18: nobody is at home at wake-up, so these slots are only for staging/tests. The camera is low (1.0 m),
    # so a standing adult is taller than the camera: the head lands at 0.29 - 0.7 * (y - 0.29) and leaves the top of the
    # frame for feet below y 0.70. Open floor exists only on the rug and the parquet in front of the coffee table.
    slots:
      - { id: near, x: 0.82, y: 0.68 }     # on the rug right of the coffee table, the sofa's right arm behind; clear of the
                                           # table, the newspaper and the bedroom door. Head at about 0.02 (low camera).
      - { id: by_hall, x: 0.935, y: 0.52 } # on the hallway floor seen through the bedroom doorway (do not use: covers the bed hotspot)
      - { id: by_sofa, x: 0.34, y: 0.64 }  # on the rug's back-left corner in front of the basket and the sofa's left arm,
                                           # left of the coffee table (overlaps only the bookshelf look-zone)

