      - { id: desk, x: 0.56, y: 0.87 }     # on the left end of the patterned rug in front of the circulation desk (left of
                                           # reading_table, so a figure here no longer stands in front of one there)
      - { id: reading_table, x: 0.68, y: 0.67 }   # on the rug right of the long table, by the potted plant; clear of the newspapers
      - { id: by_shelves, x: 0.17, y: 0.70 }      # on the aisle floor between the low bookcase and the tall shelves, browsing
