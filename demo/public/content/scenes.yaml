    # Open floor: the wooden floor in the foreground, the rug around the coffee table (not the strip behind it, where the
    # table would have to hide the legs), and the floor in front of the reception counter. Nothing stands in front of the
    # coffee table: the figure would cover the magazines.
    slots:
      - { id: near, x: 0.22, y: 1.0 }      # on the wooden floor in the left foreground, left of the coffee table; head at about 0.19
      - { id: front_desk, x: 0.86, y: 0.80 }  # on the floor in front of the reception counter, facing it (over the reception look-zone only)
      - { id: by_cooler, x: 0.13, y: 0.74 }   # on the floor in front of the potted plant, right of the water cooler
      - { id: by_chairs, x: 0.72, y: 0.70 }   # on the rug's right end, right of the coffee table, the right-hand waiting chairs behind
      - { id: by_table, x: 0.31, y: 0.62 }    # on the rug beside the coffee table's left end, the waiting chairs behind
      - { id: waiting_seat, x: 0.73, y: 0.535, seated: true }   # on the right-most waiting chair (stool base at the chair legs)

