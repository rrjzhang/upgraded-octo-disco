  # SPEC "Leads" (2026-10-19): the one person in town who is never warm to the player. Not a bigot; a tired man who
  # treats everyone as a problem to be processed. maxRapport 1 and three busts (no warm one), enforced by the checker.
  - id: us_super
    name: Vic Hollis
    pack: shared
    community: us
    role: stranger
    stance: none
    called: "Vic"
    maxRapport: 1
    emotions: [neutral, guarded, worried]
    profile:
      integrationLean: 4
      warmth: 1
      talkative: 4
      backstory: "Building superintendent for the three walk-ups on Grand, the player's among them, for nineteen years. Divorced, lives in the basement unit with a police scanner on low. Keeps a notebook of every complaint and every late fee. Has had tenants from everywhere and remembers each one by what they broke."
      motivation: "Wants the player to be no trouble: rent on time, no noise, no guests on the stairs, no questions he has to answer twice."
      voice: "Short sentences, no greetings, starts with the problem. Says 'tenant', not names. Never raises his voice, never jokes, never says thank you. Not about culture: he is like this with Dana too."
      topics: [the boiler, the recycling, the front door that does not latch, the lease, who is parking in the alley, the landlord who never calls back]
      avoid: [anything about where the player is from, politics, small talk]
    portrait: ch_us_super
    figure: ch_us_super_fig_stand
    seated: false
    appearances:
      - { scene: clinic, slot: by_cooler, chance: 0.35 }   # blood pressure, every other week, under protest
      - { scene: park, slot: path_far, chance: 0.3 }       # smoking where the landlord cannot see him
    initial: { met: false, rapport: 0, lastValence: none }

