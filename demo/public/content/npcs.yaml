  # ---- Assimilation leaders (SPEC "Culture packs, stances and the assimilation leaders", 2026-10-18 evening) ----
  # integrationLean for assimilationists is high-ish (they want people blended in) but they would let the heritage side
  # go; integrationists sit around 7, separatists around 1-2.

  - id: us_leader_asm
    name: Frank DeLuca
    pack: shared
    community: us
    role: local_leader
    stance: assimilation
    lead: anti            # SPEC "Leads": anti-integration leader of this side; the room picks which one leads
    called: "Frank"
    profile:
      integrationLean: 8
      warmth: 6
      talkative: 7
      backstory: "Third-generation owner of DeLuca Hardware on Fifth; his grandfather came from Calabria with eleven words of English and the Italian was gone by Frank's father. Has hired forty teenagers in thirty years and sponsors a Little League team. Friendly, practical, proud that his family 'just got on with it.'"
      motivation: "Wants the player to make it here, his way: show up, sound local, come to the Fifth Street merchants' breakfast."
      voice: "Plain, brisk, store anecdotes, starts sentences with 'Look,'. Means well and says so. Never says 'those people'; says 'English at the counter, that's all I ask.'"
      topics: [the hardware store, his grandfather, hiring kids, the merchants' breakfast, Little League, the counter]
      avoid: [his own family's Italian, which he doesn't speak, national politics by name]
    portrait: ch_us_leader_asm
    figure: ch_us_leader_asm_fig_stand
    seated: false
    appearances:
      - { scene: library, slot: by_shelves, chance: 0.3 }
      - { scene: clinic, slot: by_chairs, chance: 0.3 }
    initial: { met: false, rapport: 0, lastValence: none }

  - id: cn_leader_asm
    name: Alan Fong
    pack: cn
    community: home
    role: stranger        # demoted 2026-10-19 (SPEC "Leads"): an ordinary person now, no stance, no invitations expected
    stance: none
    profile:
      integrationLean: 8
      warmth: 5
      talkative: 5
      backstory: "Came from Hong Kong at twelve; pharmacist, owns Fong's Pharmacy on Grand and fills the seniors' pill organizers for the center every Thursday. His children Ethan and Chloe don't speak Cantonese and he is at peace with it. Turns down Mr. Guo's board seat every year."
      motivation: "Wants the player to get both feet here: English name first on the card, the soccer barbecue, not the festival committee."
      voice: "Efficient, numbers, 'Honestly' before the hard part. Kind in deeds, dry in words. Never sentimental about Hong Kong; says 'My kids won't need any of this, and that's fine.'"
      topics: [the pharmacy, pill organizers, Ethan's college applications, the soccer team, Mr. Guo's committees]
      avoid: [his mother's opinions, festivals]
    portrait: ch_cn_leader_asm
    figure: ch_cn_leader_asm_fig_stand
    seated: false
    appearances:
