# Nobody appears in `home`: visits there are events (events.csv, scene home) read as a knock or a call.
# Walt and Mr. Lin keep the seated chess figure in the park; elsewhere they use a standing figure (per-appearance `figure`).
# National leaders have no figure and no appearances: they are seen only on TV (home, clinic) and in news.
