# Culture-pack keywords for the checker's PACK_LEAK lint (SPEC "Culture packs" and "Checker").
# Text that every pack sees (events.csv / news.csv rows with a blank pack and no pack-only npc or scene, the shared
# dialogue sheets us_* and nat_*, shared scenes, strings, the questionnaire) must not use these words; text that only
# one pack sees must not use another pack's words. Lowercase; matched as whole words or phrases, case-insensitive,
# with an optional plural s. {placeholders} are skipped (pack.<pack>.<name> strings fill them per pack).
# Writers may extend the lists. Deliberately absent: "grand avenue" alone and "grand" (the street the player lives on
# is shared; only the center on it is cn), "ortiz" (Dana's neighbour and the inclusive president are shared people),
# "tai chi" and "tea" (ordinary in any US park or kitchen), "guatemalan" (an "other" community, shared).
